# Builds the public site (tools/public-site/build.py) and deploys it to GitHub Pages on every push
# to main. One-time setup by the repo owner: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions". People in the photos are anonymized during the build; see tools/public-site/.
name: Public site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - run: python3 tools/scene-graph-editor/validate.py
      - run: python3 tools/public-site/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/public-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
